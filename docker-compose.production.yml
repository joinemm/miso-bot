services:
  bot-db:
    volumes:
      - ./mariadb/encryption.cnf:/etc/mysql/conf.d/encryption.cnf:ro
      - type: bind
        source: /run/secrets/mariadb_encryption_key
        target: /run/mariadb-encryption/keys
        read_only: true
        bind:
          create_host_path: false

  shlink-db:
    volumes:
      - ./mariadb/encryption.cnf:/etc/mysql/conf.d/encryption.cnf:ro
      - type: bind
        source: /run/secrets/mariadb_encryption_key
        target: /run/mariadb-encryption/keys
        read_only: true
        bind:
          create_host_path: false
